{{ define "main" }}

<div class="page-header">
  <h1>{{ .Title }}</h1>
</div>

<div class="contact-block">
  <p>
    <a href="mailto:{{ site.Params.email }}">{{ site.Params.email }}</a>
  </p>
  <p>{{ site.Params.department }}<br>{{ site.Params.institution }}</p>
  <div class="contact-links">
    {{ with site.Params.linkedin }}
    <a class="icon-link" href="{{ . }}" target="_blank" rel="noopener">LinkedIn</a>
    {{ end }}
    <a class="icon-link" href="{{ site.Params.cv | relURL }}" target="_blank" rel="noopener">CV (PDF)</a>
  </div>
</div>

{{ end }}
